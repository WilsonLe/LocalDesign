name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
        env:
          LOCALDESIGN_PROFILE: "1"
          LOCALDESIGN_TRACE: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-diagnostics
          path: test-results/
          retention-days: 7
