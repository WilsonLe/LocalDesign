name: Ubuntu ARM full validation (diagnostic)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: lscpu
      - run: npm run check
      - name: Three additional fresh cold runs after the ordinary full suite
        run: |
          python3 - <<'PY'
          import subprocess, pathlib, json
          out=pathlib.Path('/tmp/localdesign-arm-validation'); out.mkdir()
          results=[]
          for i in range(3):
              log=out/f'cold-{i}.log'
              with log.open('w') as f:
                  run=subprocess.run(['npx','playwright','test','tests/browser/cold-navigation.spec.ts','--grep','first visits','--output',str(out/f'cold-{i}')],stdout=f,stderr=subprocess.STDOUT)
              line=next(l for l in log.read_text().splitlines() if l.startswith('COLD_NAVIGATION '))
              result={'run':i,'exitCode':run.returncode,'metrics':json.loads(line.removeprefix('COLD_NAVIGATION '))}
              results.append(result);print(json.dumps(result),flush=True)
          (out/'results.json').write_text(json.dumps(results,indent=2))
          raise SystemExit(1 if any(r['exitCode'] for r in results) else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-validation
          path: |
            test-results/
            /tmp/localdesign-arm-validation/
          retention-days: 7
