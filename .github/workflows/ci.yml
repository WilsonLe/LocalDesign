name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compare cold visits in a fresh browser before the suite
        continue-on-error: true
        run: npm run build && npx playwright test --grep 'first visits to dense text regions' --repeat-each=3 --output=cold-before-results
      - run: npm run check
      - name: Compare cold visits in a fresh browser after the suite
        if: always()
        continue-on-error: true
        run: npx playwright test --grep 'first visits to dense text regions' --repeat-each=3 --output=cold-after-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-process-comparison
          path: |
            test-results/
            cold-before-results/
            cold-after-results/
          retention-days: 7
